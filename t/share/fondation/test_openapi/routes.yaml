/api/status:
  get:
    summary: Health check
    operationId: health_check
    x-mojo-to: Status#check
    x-auth: {}
    responses:
      200:
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                uptime:
                  type: integer

/api/export:
  post:
    summary: Export data
    operationId: export_create
    x-mojo-to: Export#create
    x-auth:
      permissions: [export_create]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [format]
            properties:
              format:
                type: string
                enum: [csv, json, xlsx]
    responses:
      200:
        description: Export ready
